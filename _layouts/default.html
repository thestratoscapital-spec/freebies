<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | default: "Free resources" }}</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #fbf8f1; --ink: #1b1a20; --soft: #6f6a62; --accent: #e5482d; --card: #ffffff; --line: #e4dccd; --code: #f1ece2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14151a; --ink: #f1ece2; --soft: #a9a39a; --accent: #ff6a4d; --card: #1d1f26; --line: #2c2f38; --code: #22252d; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 18px 64px; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 0.6em; }
    h2 { font-size: 1.3rem; margin: 2em 0 0.6em; padding-top: 1em; border-top: 1px solid var(--line); }
    h3 { font-size: 1.08rem; margin: 1.6em 0 0.4em; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
    blockquote { margin: 1em 0; padding: 0.6em 1em; border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; color: var(--soft); }
    code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: var(--code); padding: 14px 16px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--line); }
    pre code { background: none; padding: 0; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.95rem; display: block; overflow-x: auto; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--soft); font-weight: 700; }
    footer { margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--line); color: var(--soft); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    {{ content }}
    <footer>Free resource · facts checked against the sources linked above.</footer>
  </main>
</body>
</html>
